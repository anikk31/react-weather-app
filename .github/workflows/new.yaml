name: test and upload to docker
on: [push,workflow_dispatch]
jobs:
  version-test:
    runs-on: ${{ matrix.os }}
    strategy:
       matrix:
         os: [windows-latest,ubuntu-latest]
         node_version: [16,18]
    steps:
      - name: checkout the code
        uses: actions/checkout@v3
      - name: download node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node_version }}
      - name: version
        run: node -v
        
        
         
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v3
      - name: downlaod node
        uses: actions/setup-node@v3
      - name: install dependacny
        run: npm install
      - name: test app
        run: npm test
    
  upload-docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v3
      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: setup buildx
        uses: docker/setup-buildx-action@v3
      - name: build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.USERNAME }}/repo:latest
